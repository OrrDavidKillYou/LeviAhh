<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LeviAhh Playlist</title>

<style>
    body{
        background:#111;
        color:white;
        font-family:Arial;
        padding:20px;
    }

    .song{
        background:#1e1e1e;
        margin:10px 0;
        padding:10px;
        border-radius:10px;
    }

    audio{
        width:100%;
        margin-top:8px;
    }
</style>
</head>
<body>

<h1>LeviAhh Playlist</h1>

<div id="playlist"></div>

<script>
const OWNER = "OrrDavidKillYou";
const REPO = "LeviAhh";
const BRANCH = "main";

// words to ignore
const ignored = [
    "background",
    "bgm",
    "ambient",
    "menu",
    "loop"
];

const playlist = document.getElementById("playlist");

async function getFiles(path = "") {

    const url =
`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}?ref=${BRANCH}`;

    const response = await fetch(url);
    const data = await response.json();

    let audioFiles = [];

    for (const item of data) {

        if (item.type === "dir") {

            const nested = await getFiles(item.path);
            audioFiles.push(...nested);

        } else {

            const lower = item.name.toLowerCase();

            const isAudio =
                lower.endsWith(".mp3") ||
                lower.endsWith(".wav") ||
                lower.endsWith(".ogg") ||
                lower.endsWith(".flac");

            const ignoredFile =
                ignored.some(word => lower.includes(word));

            if (isAudio && !ignoredFile) {
                audioFiles.push(item.download_url);
            }
        }
    }

    return audioFiles;
}

async function loadPlaylist() {

    const songs = await getFiles();

    songs.forEach(song => {

        const div = document.createElement("div");
        div.className = "song";

        const title = document.createElement("div");
        title.textContent =
            decodeURIComponent(song.split("/").pop());

        const audio = document.createElement("audio");
        audio.controls = true;
        audio.src = song;

        div.appendChild(title);
        div.appendChild(audio);

        playlist.appendChild(div);
    });
}

loadPlaylist();
</script>

</body>
</html>
