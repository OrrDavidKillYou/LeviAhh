<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LeviAhh Music Player</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#0f0f0f,#1b1b1b);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.player{
    width:430px;
    background:#181818;
    border-radius:22px;
    padding:25px;
    box-shadow:0 0 40px rgba(0,0,0,0.6);
}

.title{
    text-align:center;
    margin-bottom:20px;
}

.title h1{
    font-size:28px;
    color:#6c63ff;
}

.now-playing{
    background:#222;
    border-radius:18px;
    padding:18px;
    text-align:center;
}

#albumArt{
    width:220px;
    height:220px;
    object-fit:cover;
    border-radius:18px;
    margin-bottom:15px;
    box-shadow:0 0 20px rgba(0,0,0,0.5);
    transition:0.3s;
}

.song-name{
    font-size:20px;
    font-weight:bold;
    margin-bottom:15px;
    word-break:break-word;
}

.progress-container{
    width:100%;
    height:8px;
    background:#333;
    border-radius:999px;
    overflow:hidden;
    cursor:pointer;
}

.progress{
    width:0%;
    height:100%;
    background:#6c63ff;
    transition:width 0.1s linear;
}

.controls{
    display:flex;
    justify-content:center;
    gap:15px;
    margin-top:25px;
    flex-wrap:wrap;
}

button{
    width:65px;
    height:65px;
    border:none;
    border-radius:50%;
    background:#2c2c2c;
    color:white;
    font-size:24px;
    cursor:pointer;
    transition:0.2s;
}

button:hover{
    transform:scale(1.08);
    background:#444;
}

#playBtn{
    background:#6c63ff;
}

#playBtn:hover{
    background:#7d75ff;
}

#shuffleBtn.active{
    background:#ff9800;
}

.playlist{
    margin-top:25px;
    max-height:320px;
    overflow-y:auto;
    padding-right:5px;
}

.playlist::-webkit-scrollbar{
    width:6px;
}

.playlist::-webkit-scrollbar-thumb{
    background:#555;
    border-radius:10px;
}

.song{
    background:#202020;
    padding:14px;
    border-radius:12px;
    margin-bottom:10px;
    cursor:pointer;
    transition:0.2s;
    font-size:15px;
}

.song:hover{
    background:#303030;
}

.song.active{
    background:#6c63ff;
}

.link{
    display:block;
    text-align:center;
    margin-top:20px;
    color:aqua;
    text-decoration:none;
    font-size:22px;
}
</style>
</head>
<body>

<div class="player">

    <div class="title">
        <h1>🎵 LeviAhh Playlist</h1>
    </div>

    <div class="now-playing">

        <img id="albumArt" src="album.jpg">

        <div class="song-name" id="songName">
            Loading songs...
        </div>

        <div class="progress-container" id="progressContainer">
            <div class="progress" id="progress"></div>
        </div>

    </div>

    <div class="controls">
        <button id="prevBtn">⏮</button>
        <button id="playBtn">▶</button>
        <button id="nextBtn">⏭</button>
        <button id="shuffleBtn">🔀</button>
    </div>

    <div class="playlist" id="playlist"></div>

    <a href="index.html" class="link">
        to main page
    </a>

</div>

<script>
const OWNER = "OrrDavidKillYou";
const REPO = "LeviAhh";
const BRANCH = "main";

const ignored = [
    "background",
    "bgm",
    "ambient",
    "menu",
    "loop"
];

let songs = [];
let currentSong = 0;
let isPlaying = false;
let shuffleMode = false;

const audio = new Audio();

const playlistDiv =
    document.getElementById("playlist");

const songName =
    document.getElementById("songName");

const playBtn =
    document.getElementById("playBtn");

const nextBtn =
    document.getElementById("nextBtn");

const prevBtn =
    document.getElementById("prevBtn");

const shuffleBtn =
    document.getElementById("shuffleBtn");

const progress =
    document.getElementById("progress");

const progressContainer =
    document.getElementById("progressContainer");

const albumArt =
    document.getElementById("albumArt");

function cleanSongName(name){

    return name
        .replace(/\.[^/.]+$/, "")
        .replace(/_/g," ");
}

async function getFiles(path = "") {

    try {

        const url =
`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}?ref=${BRANCH}`;

        const response = await fetch(url);

        if(!response.ok){
            throw new Error("GitHub API failed");
        }

        const data = await response.json();

        let files = [];

        for(const item of data){

            if(item.type === "dir"){

                const nested =
                    await getFiles(item.path);

                files.push(...nested);

            } else {

                const lower =
                    item.name.toLowerCase();

                const isAudio =
                    lower.endsWith(".mp3") ||
                    lower.endsWith(".wav") ||
                    lower.endsWith(".ogg") ||
                    lower.endsWith(".flac") ||
                    lower.endsWith(".m4a");

                const ignoredFile =
                    ignored.some(word =>
                        lower.includes(word)
                    );

                if(isAudio && !ignoredFile){

                    files.push({
                        name:item.name,
                        url:item.download_url
                    });
                }
            }
        }

        return files;

    } catch(err){

        console.error(err);

        songName.textContent =
            "Failed to load songs";

        return [];
    }
}

function loadSong(index){

    currentSong = index;

    audio.src = songs[index].url;

    songName.textContent =
        cleanSongName(songs[index].name);

    albumArt.src = "album.jpg";

    if ('mediaSession' in navigator) {

        navigator.mediaSession.metadata =
            new MediaMetadata({
                title: cleanSongName(songs[index].name),
                artist: "LeviAhh Playlist",
                album: "LeviAhh Music",
                artwork: [
                    {
                        src: "album.jpg",
                        sizes: "512x512",
                        type: "image/jpeg"
                    }
                ]
            });
    }

    document
        .querySelectorAll(".song")
        .forEach((el,i)=>{

        el.classList.toggle(
            "active",
            i === index
        );
    });
}

function playSong(){

    audio.play();

    isPlaying = true;

    playBtn.textContent = "⏸";

    albumArt.style.transform =
        "scale(1.03) rotate(1deg)";
}

function pauseSong(){

    audio.pause();

    isPlaying = false;

    playBtn.textContent = "▶";

    albumArt.style.transform =
        "scale(1)";
}

function nextSong(){

    if(shuffleMode){

        currentSong =
            Math.floor(Math.random() * songs.length);

    } else {

        currentSong++;

        if(currentSong >= songs.length){
            currentSong = 0;
        }
    }

    loadSong(currentSong);
    playSong();
}

function prevSong(){

    if(shuffleMode){

        currentSong =
            Math.floor(Math.random() * songs.length);

    } else {

        currentSong--;

        if(currentSong < 0){
            currentSong = songs.length - 1;
        }
    }

    loadSong(currentSong);
    playSong();
}

playBtn.onclick = () => {

    if(isPlaying){
        pauseSong();
    } else {
        playSong();
    }
};

nextBtn.onclick = () => {
    nextSong();
};

prevBtn.onclick = () => {
    prevSong();
};

shuffleBtn.onclick = () => {

    shuffleMode = !shuffleMode;

    shuffleBtn.classList.toggle(
        "active",
        shuffleMode
    );
};

audio.addEventListener("ended", () => {
    nextSong();
});

audio.addEventListener("timeupdate", () => {

    if(audio.duration){

        const percent =
            (audio.currentTime / audio.duration) * 100;

        progress.style.width =
            percent + "%";
    }
});

progressContainer.addEventListener("click", (e) => {

    if(!audio.duration) return;

    const rect =
        progressContainer.getBoundingClientRect();

    const clickX =
        e.clientX - rect.left;

    const width =
        rect.width;

    const percent =
        clickX / width;

    audio.currentTime =
        percent * audio.duration;
});

async function init(){

    songName.textContent =
        "Loading songs...";

    songs = await getFiles();

    songs.sort((a,b)=>
        a.name.localeCompare(b.name)
    );

    playlistDiv.innerHTML = "";

    if(songs.length === 0){

        songName.textContent =
            "No songs found";

        return;
    }

    songs.forEach((song,index)=>{

        const div =
            document.createElement("div");

        div.className = "song";

        div.textContent =
            cleanSongName(song.name);

        div.onclick = () => {

            loadSong(index);
            playSong();
        };

        playlistDiv.appendChild(div);
    });

    loadSong(0);
}

init();
</script>

</body>
</html>
