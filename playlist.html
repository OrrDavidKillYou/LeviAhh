<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LeviAhh Music Player</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:linear-gradient(135deg,#0f0f0f,#1b1b1b);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.player{
    width:430px;
    background:#181818;
    border-radius:22px;
    padding:25px;
    box-shadow:0 0 40px rgba(0,0,0,0.6);
}

.title{
    text-align:center;
    margin-bottom:20px;
}

.title h1{
    font-size:28px;
    color:#6c63ff;
}

.now-playing{
    background:#222;
    border-radius:18px;
    padding:18px;
    text-align:center;
}

.song-name{
    font-size:20px;
    font-weight:bold;
    margin-bottom:15px;
    word-break:break-word;
}

.progress-container{
    width:100%;
    height:7px;
    background:#333;
    border-radius:999px;
    overflow:hidden;
}
    .niga {
        color:aqua;
        font-size:25px;
        text-decoration:none;
    }
        

.progress{
    width:0%;
    height:100%;
    background:#6c63ff;
    transition:width 0.1s linear;
}

.controls{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-top:25px;
}

button{
    width:65px;
    height:65px;
    border:none;
    border-radius:50%;
    background:#2c2c2c;
    color:white;
    font-size:24px;
    cursor:pointer;
    transition:0.2s;
}

button:hover{
    transform:scale(1.08);
    background:#444;
}

#playBtn{
    background:#6c63ff;
}

#playBtn:hover{
    background:#7d75ff;
}

.playlist{
    margin-top:25px;
    max-height:320px;
    overflow-y:auto;
    padding-right:5px;
}

.playlist::-webkit-scrollbar{
    width:6px;
}

.playlist::-webkit-scrollbar-thumb{
    background:#555;
    border-radius:10px;
}

.song{
    background:#202020;
    padding:14px;
    border-radius:12px;
    margin-bottom:10px;
    cursor:pointer;
    transition:0.2s;
    font-size:15px;
}

.song:hover{
    background:#303030;
}

.song.active{
    background:#6c63ff;
}
</style>
</head>
<body>

<div class="player">

    <div class="title">
        <h1>🎵 LeviAhh Playlist</h1>
    </div>

    <div class="now-playing">
        <div class="song-name" id="songName">
            Loading songs...
        </div>

        <div class="progress-container">
            <div class="progress" id="progress"></div>
        </div>
    </div>

    <div class="controls">
        <button id="prevBtn">⏮</button>
        <button id="playBtn">▶</button>
        <button id="nextBtn">⏭</button>
    </div>

    <div class="playlist" id="playlist"></div>

</div>

<script>
const OWNER = "OrrDavidKillYou";
const REPO = "LeviAhh";
const BRANCH = "main";

const ignored = [
    "background",
    "bgm",
    "ambient",
    "menu",
    "loop"
];

let songs = [];
let currentSong = 0;
let isPlaying = false;

const audio = new Audio();

const playlistDiv = document.getElementById("playlist");
const songName = document.getElementById("songName");
const playBtn = document.getElementById("playBtn");
const nextBtn = document.getElementById("nextBtn");
const prevBtn = document.getElementById("prevBtn");
const progress = document.getElementById("progress");

function cleanSongName(name){

    return name
        .replace(/\.[^/.]+$/, "")
        .replace(/_/g, " ");
}

async function getFiles(path = "") {

    const url =
`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}?ref=${BRANCH}`;

    const response = await fetch(url);
    const data = await response.json();

    let files = [];

    for (const item of data) {

        if (item.type === "dir") {

            const nested = await getFiles(item.path);
            files.push(...nested);

        } else {

            const lower = item.name.toLowerCase();

            const isAudio =
                lower.endsWith(".mp3") ||
                lower.endsWith(".wav") ||
                lower.endsWith(".ogg") ||
                lower.endsWith(".flac");

            const ignoredFile =
                ignored.some(word => lower.includes(word));

            if (isAudio && !ignoredFile) {

                files.push({
                    name: item.name,
                    url: item.download_url
                });
            }
        }
    }

    return files;
}

function loadSong(index){

    currentSong = index;

    audio.src = songs[index].url;

    songName.textContent =
        cleanSongName(songs[index].name);

    document.querySelectorAll(".song").forEach((el,i)=>{

        el.classList.toggle("active", i === index);
    });
}

function playSong(){

    audio.play();

    isPlaying = true;

    playBtn.textContent = "⏸";
}

function pauseSong(){

    audio.pause();

    isPlaying = false;

    playBtn.textContent = "▶";
}

playBtn.onclick = () => {

    if(isPlaying){
        pauseSong();
    } else {
        playSong();
    }
};

nextBtn.onclick = () => {

    currentSong++;

    if(currentSong >= songs.length){
        currentSong = 0;
    }

    loadSong(currentSong);
    playSong();
};

prevBtn.onclick = () => {

    currentSong--;

    if(currentSong < 0){
        currentSong = songs.length - 1;
    }

    loadSong(currentSong);
    playSong();
};

audio.addEventListener("ended", () => {

    currentSong++;

    if(currentSong >= songs.length){
        currentSong = 0;
    }

    loadSong(currentSong);
    playSong();
});

audio.addEventListener("timeupdate", () => {

    if(audio.duration){

        const percent =
            (audio.currentTime / audio.duration) * 100;

        progress.style.width = percent + "%";
    }
});

async function init(){

    songs = await getFiles();

    songs.sort((a,b)=>
        a.name.localeCompare(b.name)
    );

    playlistDiv.innerHTML = "";

    songs.forEach((song,index)=>{

        const div = document.createElement("div");

        div.className = "song";

        div.textContent =
            cleanSongName(song.name);

        div.onclick = () => {

            loadSong(index);
            playSong();
        };

        playlistDiv.appendChild(div);
    });

    if(songs.length > 0){

        loadSong(0);

    } else {

        songName.textContent = "No songs found";
    }
}

init();
</script>
<a href="index.html" class="niga">to main page</a>
</body>
</html>
