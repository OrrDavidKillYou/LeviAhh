<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LeviAhh Music Player</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:linear-gradient(135deg,#0f0f0f,#1f1f1f);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.player{
    width:420px;
    background:#181818;
    border-radius:20px;
    padding:25px;
    box-shadow:0 0 30px rgba(0,0,0,0.5);
}

.title{
    text-align:center;
    margin-bottom:20px;
}

.title h1{
    font-size:28px;
}

.now-playing{
    background:#222;
    padding:15px;
    border-radius:15px;
    margin-bottom:20px;
    text-align:center;
}

.song-name{
    font-size:18px;
    font-weight:bold;
    margin-bottom:5px;
}

.controls{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-top:20px;
}

button{
    border:none;
    background:#2e2e2e;
    color:white;
    width:60px;
    height:60px;
    border-radius:50%;
    font-size:22px;
    cursor:pointer;
    transition:0.2s;
}

button:hover{
    background:#444;
    transform:scale(1.08);
}

.playlist{
    margin-top:25px;
    max-height:300px;
    overflow-y:auto;
}

.song{
    padding:12px;
    border-radius:10px;
    margin-bottom:10px;
    background:#202020;
    cursor:pointer;
    transition:0.2s;
}

.song:hover{
    background:#333;
}

.song.active{
    background:#4a4aff;
}

.progress-container{
    width:100%;
    height:6px;
    background:#333;
    border-radius:10px;
    margin-top:20px;
    overflow:hidden;
}

.progress{
    height:100%;
    width:0%;
    background:#4a4aff;
}
</style>
</head>
<body>

<div class="player">

    <div class="title">
        <h1>🎵 LeviAhh Playlist</h1>
    </div>

    <div class="now-playing">
        <div class="song-name" id="songName">
            Loading songs...
        </div>

        <div class="progress-container">
            <div class="progress" id="progress"></div>
        </div>
    </div>

    <div class="controls">
        <button id="prevBtn">⏮</button>
        <button id="playBtn">▶</button>
        <button id="nextBtn">⏭</button>
    </div>

    <div class="playlist" id="playlist"></div>

</div>

<script>
const OWNER = "OrrDavidKillYou";
const REPO = "LeviAhh";
const BRANCH = "main";

const ignored = [
    "background",
    "bgm",
    "ambient",
    "menu",
    "loop"
];

let songs = [];
let currentSong = 0;
let isPlaying = false;

const audio = new Audio();

const playlistDiv = document.getElementById("playlist");
const songName = document.getElementById("songName");
const playBtn = document.getElementById("playBtn");
const nextBtn = document.getElementById("nextBtn");
const prevBtn = document.getElementById("prevBtn");
const progress = document.getElementById("progress");

async function getFiles(path = "") {

    const url =
`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}?ref=${BRANCH}`;

    const response = await fetch(url);
    const data = await response.json();

    let files = [];

    for (const item of data) {

        if (item.type === "dir") {

            const nested = await getFiles(item.path);
            files.push(...nested);

        } else {

            const lower = item.name.toLowerCase();

            const isAudio =
                lower.endsWith(".mp3") ||
                lower.endsWith(".wav") ||
                lower.endsWith(".ogg") ||
                lower.endsWith(".flac");

            const ignoredFile =
                ignored.some(word => lower.includes(word));

            if (isAudio && !ignoredFile) {
                files.push({
                    name: item.name,
                    url: item.download_url
                });
            }
        }
    }

    return files;
}

function loadSong(index){

    currentSong = index;

    audio.src = songs[index].url;

    songName.textContent = songs[index].name;

    document.querySelectorAll(".song").forEach((el,i)=>{
        el.classList.toggle("active", i === index);
    });
}

function playSong(){

    audio.play();

    isPlaying = true;

    playBtn.textContent = "⏸";
}

function pauseSong(){

    audio.pause();

    isPlaying = false;

    playBtn.textContent = "▶";
}

playBtn.onclick = () => {

    if(isPlaying){
        pauseSong();
    } else {
        playSong();
    }
};

nextBtn.onclick = () => {

    currentSong++;

    if(currentSong >= songs.length){
        currentSong = 0;
    }

    loadSong(currentSong);
    playSong();
};

prevBtn.onclick = () => {

    currentSong--;

    if(currentSong < 0){
        currentSong = songs.length - 1;
    }

    loadSong(currentSong);
    playSong();
};

audio.addEventListener("ended", () => {

    currentSong++;

    if(currentSong >= songs.length){
        currentSong = 0;
    }

    loadSong(currentSong);
    playSong();
});

audio.addEventListener("timeupdate", () => {

    if(audio.duration){

        const percent =
            (audio.currentTime / audio.duration) * 100;

        progress.style.width = percent + "%";
    }
});

async function init(){

    songs = await getFiles();

    songs.sort((a,b)=>
        a.name.localeCompare(b.name)
    );

    playlistDiv.innerHTML = "";

    songs.forEach((song,index)=>{

        const div = document.createElement("div");

        div.className = "song";

        div.textContent = song.name;

        div.onclick = () => {

            loadSong(index);
            playSong();
        };

        playlistDiv.appendChild(div);
    });

    if(songs.length > 0){
        loadSong(0);
    } else {
        songName.textContent = "No songs found";
    }
}

init();
</script>

</body>
</html>
